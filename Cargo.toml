[package]
name = "nabu"
version = "0.1.0"
edition = "2024"
description = "Append-only local knowledge store for coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
git2 = "0.20"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
tempfile = "3.20"
